const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
async function open(pw){
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem("desk", pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById("err").textContent = "That is not the password.";
    document.getElementById("pw").select();
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); open(document.getElementById("pw").value); });
